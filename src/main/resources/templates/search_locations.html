<!DOCTYPE html>
<!-- saved from url=(0074)https://zhukovsd.github.io/weather-viewer-html-layouts/search-results.html -->
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>Weather Viewer – Homepage</title>
    <link th:href="@{/static/css/weather-viewer-searchpage_files/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/weather-viewer-searchpage_files/style.css}">
</head>
<body>

<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/app}">
            <img th:src="@{/static/css/weather-viewer-searchpage_files/weather-app.png}" alt="" width="30" height="24"
                 class="d-inline-block align-text-top">
            Weather Tracker
        </a>
        <div class="d-flex align-items-center" th:if="${username != null}">
            <span class="navbar-text me-3" th:text="${username}">zhukovsd</span>
            <form th:action="@{/app/sign_out}" method="post">
                <button  class="btn btn-outline-danger" type="submit">Sign out</button>
            </form>
        </div>
        <div class="d-flex align-items-center" th:if="${username == null}">
            <span class="navbar-text me-3">Hi!</span>
            <a th:href="@{/app/login}" class="btn btn-outline-danger">Sign in</a>
        </div>
    </div>
</nav>

<section id="page-content">
    <div class="container mt-4">
        <form th:action="@{/app/locations/search}" method="get" class="d-flex my-4">
            <div class="input-group location-search-input-group me-3">
                <input class="form-control" type="text" name="city" placeholder="Enter location"
                       th:value="${searchingCity}" value="San Francisco" required="">
                <button class="btn btn-outline-secondary btn-sm clear-input-button" type="button"
                        onclick="this.previousElementSibling.value=&#39;&#39;">
                    ×
                </button>
            </div>
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

        <div>
            <h2>Locations:</h2>
            <div class="row">
                <form th:each="city : ${resultCities}"  th:action="@{/app/locations}" method="post" class="col-12 col-lg-3 col-md-6 mb-4">
                    <div class="card h-100">
                        <div class="card-body d-flex flex-column">


                            <input type="hidden"  th:value="${city.name()}" name="name">
                            <input type="hidden" name="latitude" th:value="${city.latitude()}">
                            <input type="hidden" name="longitude" th:value="${city.longitude()}">
                            <input type="hidden" name="searchVal" th:value="${searchingCity}">


                            <h5 class="card-title" th:text="${city.name()}">San Francisco</h5>
                            <p class="card-text mb-1" th:text="${city.latitude()}">Latitude: 37.7790262</p>
                            <p class="card-text mb-1" th:text="${city.longitude()}">Longitude: -122.419906</p>

                            <div class="mt-auto">
                                <button class="btn btn-primary w-100">Add</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Viewer</span>
    </div>
</footer>


</body>
</html>
