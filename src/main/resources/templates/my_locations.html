<!DOCTYPE html>
<!-- saved from url=(0065)https://zhukovsd.github.io/weather-viewer-html-layouts/index.html -->
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>Weather Viewer – Homepage</title>
    <link th:href="@{/static/css/saved_locations_files/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/saved_locations_files/style.css}">
</head>
<body>

<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/app}">
            <img th:src="@{/static/css/saved_locations_files/weather-app.png}" alt="" width="30" height="24"
                 class="d-inline-block align-text-top">
            Weather Tracker
        </a>
        <div class="d-flex align-items-center" th:if="${username != null}">
            <span class="navbar-text me-3" th:text="${username}">username</span>
            <form th:action="@{/app/sign_out}" method="post">
                <button class="btn btn-outline-danger" type="submit">Sign out</button>
            </form>
        </div>
        <div class="d-flex align-items-center" th:if="${username == null}">
            <span class="navbar-text me-3">Hi!</span>
            <a th:href="@{/app/login}" class="btn btn-outline-danger">Sign in</a>
        </div>
    </div>
</nav>

<section id="page-content">
    <div class="container mt-4">
        <form th:action="@{/app/locations/search}" method="get" class="d-flex my-4">
            <div class="input-group location-search-input-group me-3">
                <input class="form-control" type="text" name="city" placeholder="Enter location" required="">
                <button class="btn btn-outline-secondary btn-sm clear-input-button" type="button"
                        onclick="this.previousElementSibling.value=&#39;&#39;">
                    ×
                </button>
            </div>
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

        <div th:if="user">
            <div class="row">

                    <div th:each="location : ${myLocations.locationWeatherDTOList()}" class="col-12 col-lg-3 col-md-6 mb-4">

                        <div class="card h-100 position-relative weather-card">
                            <form th:action="@{'/app/locations/delete'}" method="POST" class="position-absolute weather-card-delete-form">
                                <input type="hidden" name="currentPage" th:value="${myLocations.currentPage()}">
                                <input type="hidden" name="latitude" th:value="${location.getLatitude()}">
                                <input type="hidden" name="longitude" th:value="${location.getLongitude()}">
                                <button class="btn-close" aria-label="Delete" type="submit"></button>
                            </form>
                            <img class="card-img-top img-fluid"
                                 th:src="@{'/static/images/'+${location.getWeatherIcon()}+'.png'}" alt="Weather icon">
                            <div class="card-body d-flex flex-column">
                                <h1 class="card-text" th:text="${location.getTemperature()}+'°C'">7°C</h1>
                                <h3 class="card-title" th:text="${location.getCity()} + ', ' + ${location.getCountryCode()} ">
                                    Tbilisi, GE</h3>
                                <h2 class="card-title"
                                    th:text="'lat: '+${location.getLatitude()} + ', lon: ' + ${location.getLongitude()} "></h2>
                                <p class="card-text mb-1">Feels like <span
                                        th:text="${location.getFeelsLikeTemperature()}">2</span>°C.
                                    <span th:text="${location.getWeatherDescription()}">Clear sky</span>
                                </p>
                                <p class="card-text mb-1" th:text="'Humidity: '+${location.getHumidity()}+'%'">Humidity:
                                    70%</p>
                            </div>
                        </div>
                    </div>

            </div>

            <div class="container">
                <div class="pagination-container">
                    <nav aria-label="Page navigation">
                        <ul class="pagination">
                            <li class="page-item disabled" th:if="${myLocations.currentPage().equals(1)}">
                                <a class="page-link" tabindex="-1" aria-disabled="true">Previous</a>
                            </li>
                            <li class="page-item" th:if="${!myLocations.currentPage().equals(1)}">
                                <a class="page-link" th:href="@{'/app?currentPage='+${myLocations.currentPage()-1}}">Previous</a>
                            </li>

                            <li class="page-item" th:if="${myLocations.currentPage()==myLocations.overallPages()}">
                                <span class="page-link bg-light text-muted" style="cursor: not-allowed; pointer-events: none;">Next</span>
                            </li>
                            <li class="page-item" th:if="${myLocations.currentPage()<myLocations.overallPages()}">
                                <a class="page-link" th:href="@{'/app?currentPage='+${myLocations.currentPage()+1}}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>

        <div class="d-flex justify-content-center align-items-center" style="height: 100%;" th:if="!user">
            <p style="color: red">Sign in account to see locations and their weather</p>
        </div>
    </div>
</section>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Viewer project</span>
    </div>
</footer>


</body>
</html>
